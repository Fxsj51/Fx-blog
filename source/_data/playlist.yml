# 歌单唯一数据源：音乐页卡片和右下角侧栏播放器都从这里生成，不要在别处再写一份曲目。
#
# 字段说明：
#   title       歌名
#   artist      演奏者/作者
#   source      来源站点，如 Wikimedia Commons
#   year        可选，公开曲目的录音/出版年份
#   cover       可选，相对路径（如 images/xxx.webp）或完整 URL；缺省用站内唱片封面
#   audio       远程完整 https 地址；本地曲目写 music/audio/文件名.mp3
#               （音频文件放在 source/music/audio/，见该目录 README）
#   lrc         可选，本地歌词文件路径，如 music/lrc/my-song.lrc；
#               缺省或文件为空/无时间轴时，音乐页歌词栏显示「纯音乐，请欣赏」
#   duration    可选，mm:ss，仅用于列表展示，播放后以实际元数据为准
#   license     授权类型，公开曲目必填
#   attribution 署名要求，公开曲目必填；无需署名时写「无需署名」
#   sourceUrl   可选，原页面链接
#
# 本地曲目（自己录制或已获得授权）不需要署名，license 写「本地曲目」即可。
#
# 路径规则（只在 scripts/playlist.js 的 resolveUrl 里实现一次）：
#   - 以 http:// 或 https:// 开头的绝对地址原样输出，不拼站点根，可指向对象存储/CDN；
#   - 其他写法按站内相对路径处理，自动补 Hexo root（子路径部署时为 /Fx-blog/）；
#   - 同一份歌单可以混用两种写法，互不影响。

