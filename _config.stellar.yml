        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>

    <style>
      /* SPA 顶部加载条：换页期间给可见反馈 */
      #spa-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 3px;
        z-index: var(--z-max);
        background: var(--accent, var(--accent));
        opacity: 0;
        pointer-events: none;
        border-radius: 0 var(--radius-micro) var(--radius-micro) 0;
      }

      /* 侧栏迷你播放器（全站唯一 <audio> 的一个视图） */
      .site-mini {
        display: flex;
        align-items: center;
        gap: var(--gap-xl);
        padding: 14px 18px;
        border-radius: var(--radius-lg);
        background: var(--mini-bg);
        border: var(--border-w) solid var(--white-18);
        backdrop-filter: var(--blur-mini);
        -webkit-backdrop-filter: var(--blur-mini);
        box-shadow: var(--shadow-mini);
        color: var(--text-primary);
      }

      .site-mini__disc {
        position: relative;
        flex: 0 0 auto;
        width: 110px;
        height: 110px;
        padding: 0;
        border: none;
        border-radius: var(--radius-circle);
        cursor: pointer;
        overflow: hidden;
        background: url(__SITE_ROOT__images/CP-disc.webp) center / cover no-repeat;
        animation: site-mini-spin var(--spin-dur) linear infinite;
        animation-play-state: paused;
      }

      .site-mini.is-playing .site-mini__disc {
        animation-play-state: running;
      }

      .site-mini__cover {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 55%;
        height: 55%;
        border-radius: var(--radius-circle);
        object-fit: cover;
        transform: translate(-50%, -50%);
      }

      @keyframes site-mini-spin {
        to { transform: rotate(360deg); }
      }

      .site-mini__info {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap-xs);
      }

      .site-mini__title {
        font-size: var(--fs-16);
        font-weight: var(--fw-semibold);
        line-height: var(--lh-normal);
        color: var(--text-primary);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: var(--ts-soft);
      }

      .site-mini__title:hover {
        color: var(--accent);
      }

      .site-mini__artist {
        font-size: var(--fs-12);
        line-height: var(--lh-normal);
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .site-mini__bar {
        height: 4px;
        border-radius: var(--radius-micro);
        background: var(--white-16);
        cursor: pointer;
      }

      .site-mini__played {
        height: 100%;
        width: 0;
        border-radius: var(--radius-micro);
        background: var(--accent);
      }

      .site-mini__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: var(--fs-12);
        color: var(--white-65);
        font-variant-numeric: tabular-nums;
      }

      .site-mini__btns {
        display: flex;
        align-items: center;
        gap: var(--gap-md);
      }

      .site-mini__btns button,
      .site-mini__list {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--white-78);
        cursor: pointer;
      }

      .site-mini__btns button:hover,
      .site-mini__list:hover {
        color: var(--accent);
      }
    </style>

  body_end: |
    <div id="music-drawer">
      <div id="music-drawer__content"></div>
    </div>

    <!-- 音乐页视图脚本：全站托管注入、仅在音乐页生效；SPA 换页后由脚本自身重新初始化 -->
    <script src="__SITE_ROOT__js/music-page.js" data-stellar-script="site" defer></script>

    <!-- 全站无刷新换页：替换页面级区域并广播 stellar:navigation-complete -->
    <script src="__SITE_ROOT__js/spa.js" data-stellar-script="site" defer></script>

    <!-- 移动端顶栏：左栏隐藏时显示头像+站名 -->
    <header id="mobile-brand-bar">
      <button type="button" id="mbb-menu-btn" class="mbb-menu-btn" aria-label="打开侧栏菜单" aria-controls="leftbar-region" aria-expanded="false">&#9776;</button>
      <a class="mbb-avatar" href="__SITE_ROOT__"><img src="__SITE_ROOT__images/01-avatar.webp" alt="头像" width="40" height="40" loading="lazy" decoding="async"></a>
      <a class="mbb-title" href="__SITE_ROOT__">
        <span class="mbb-name">__SITE_BRAND_NAME__</span>
        <span class="mbb-tagline">__SITE_BRAND_TAGLINE__</span>
      </a>
    </header>

    <!-- 注入自定义的侧边栏按钮 -->
    <button id="custom-rightbar-toggle" class="custom-toggle-btn">
      <span class="arrow-icon">‹</span>
    </button>

    <script data-stellar-script="site">
    (function() {
      'use strict';

      // 右栏断点唯一来源：>1180 常驻、≤1180 抽屉。
      // 必须与 CSS 里的 max-width: 1180px 以及 patches/hexo-theme-stellar+2.0.0.patch 保持一致。
      var RIGHTBAR_DRAWER_MAX = 1180;
      function isRightbarPinned() {
        return window.innerWidth > RIGHTBAR_DRAWER_MAX;
      }

      // 统一控制右栏显示：同时切换 class 和 inert/aria-hidden 属性
      function setRightbar(show) {
        var rightbar = document.getElementById('rightbar-region');
        // 无右栏页面（音乐/关于/分类/标签/归档等）没有可切换的面板
        if (!rightbar) return;
        if (show) {
          initCardOnce();
          document.body.classList.add('show-rightbar');
          rightbar.removeAttribute('inert');
          rightbar.setAttribute('aria-hidden', 'false');
        } else {
          document.body.classList.remove('show-rightbar');
          rightbar.setAttribute('inert', '');
          rightbar.setAttribute('aria-hidden', 'true');
        }
      }

      // 无右栏页面：隐藏右栏抽屉开关（用内联 display 覆盖 CSS，SPA 换页回到有右栏页面时能恢复）
      function syncPageChrome() {
        var toggleBtn = document.getElementById('custom-rightbar-toggle');
        var rightbar = document.getElementById('rightbar-region');
        document.body.classList.remove('show-rightbar');
        if (toggleBtn) {
          toggleBtn.style.display = rightbar ? '' : 'none';
          if (rightbar && !toggleBtn.__stellarBound) {
            toggleBtn.__stellarBound = true;
            toggleBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              setRightbar(!document.body.classList.contains('show-rightbar'));
            });
          }
        }
        // 右侧栏内部点击不冒泡，避免触发 document 关闭
        if (rightbar && !rightbar.__stellarStopClick) {
          rightbar.__stellarStopClick = true;
          rightbar.addEventListener('click', function(e) {
            e.stopPropagation();
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        var menuBtn = document.getElementById('mbb-menu-btn');
        var shell = document.querySelector('.site-shell');

        syncPageChrome();

        // 移动端菜单按钮：复用主题的左栏抽屉逻辑（滚动/遮罩/ESC 由主题处理）
        if (menuBtn && shell) {
          menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            var shellBtn = document.querySelector('[data-shell-action="toggle-leftbar-drawer"]');
            if (shellBtn) shellBtn.click();
            menuBtn.setAttribute('aria-expanded', shell.getAttribute('data-drawer') === 'leftbar' ? 'true' : 'false');
          });
          if ('MutationObserver' in window) {
            new MutationObserver(function() {
              menuBtn.setAttribute('aria-expanded', shell.getAttribute('data-drawer') === 'leftbar' ? 'true' : 'false');
            }).observe(shell, { attributes: true, attributeFilter: ['data-drawer'] });
          }
        }
      });

      // 点击页面其它地方关闭抽屉（document 级，只绑一次）
      document.addEventListener('click', function() {
        if (document.body.classList.contains('show-rightbar')) {
          setRightbar(false);
        }
      });

      // SPA 换页后：#rightbar-region 可能被替换/移除，重新同步开关并按新节点重新初始化右栏卡片
      document.addEventListener('stellar:navigation-complete', function() {
        syncPageChrome();
        scheduleCard();
      });

      // 窗口拖宽时自动收回抽屉（左栏抽屉由主题的 matchMedia 监听自动收起）
      var __sidebarResizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(__sidebarResizeTimer);
        __sidebarResizeTimer = setTimeout(function() {
          var body = document.body;
          var needReset = false;
          if (isRightbarPinned()) {
            initCardOnce();
            if (body.classList.contains('show-rightbar')) {
              needReset = true;
            }
          }
          if (needReset) {
            body.classList.add('sb-no-transition');
            void document.documentElement.offsetHeight;
            setRightbar(false);
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                body.classList.remove('sb-no-transition');
              });
            });
          }
        }, 100);
      });

      const CONFIG = {
        lunarCdn: [
          'https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js',
          'https://unpkg.com/lunar-javascript/lunar.js'
        ],
        historyApi: 'https://baike.baidu.com/cms/home/eventsOnHistory/',
        quoteApi: 'https://uapis.cn/api/v1/saying/random?mode=daily',
        maxHistoryItems: 3
      };

      const LOCAL_QUOTES = [
        "史册未载今日事，且借诗意度流年。",
        "今天在历史上或许平平无奇，但对你而言，却是独一无二的一天。",
        "历史的长河在此刻稍作停歇，留一方静谧，听风吟诗。",
        "今日无事发生，宜静心，宜读书，宜发呆。",
        "没有宏大叙事的今天，最适合记录属于你的微小日常。",
        "生活明朗，万物可爱，人间值得，未来可期。",
        "愿你踏过千重浪，能留在爱人的身旁。",
        "星光不问赶路人，时光不负有心人。",
        "保持热爱，奔赴山海。",
        "慢慢来，谁不是翻山越岭去成长。",
        "去做你想做的事，趁阳光正好，趁微风不噪。",
        "别慌，月亮也正在大海某处迷茫。",
        "把烦心事丢掉，腾出地方装鲜花。",
        "希望你的底色一直是善良和勇敢。",
        "万事都要全力以赴，包括开心。",
        "不用刻意去迎合别人，做自己就好。",
        "总有一天，你会遇到那个愿意为你弯腰的人。",
        "你只管努力，剩下的交给时间。",
        "凡是过往，皆为序章。",
        "心之所向，素履以往。"
      ];

      const lunarCache = new Map();
      const $ = (id) => document.getElementById(id);
      const pad = (n) => String(n).padStart(2, '0');
      const hasChinese = (str) => /[\u4e00-\u9fa5]/.test(str);
      const escapeHtml = (value) => String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error('Failed to load: ' + url));
          document.head.appendChild(s);
        });
      }

      async function loadLunarLibrary() {
        if (typeof Solar !== 'undefined' && typeof Lunar !== 'undefined') return;
        for (const url of CONFIG.lunarCdn) {
          try {
            await loadScript(url);
            if (typeof Solar !== 'undefined') return;
          } catch (e) {
            console.warn('[Lunar] CDN 失败，尝试下一个:', url);
          }
        }
        throw new Error('所有农历库 CDN 均加载失败');
      }

      function safeGetLunarDay(year, month, day) {
        const key = `${year}-${month}-${day}`;
        if (lunarCache.has(key)) return lunarCache.get(key);
        let result = { day: day };
        try {
          const solar = Solar.fromYmd(year, month, day);
          const lunar = solar.getLunar();
          const dayStr = lunar.getDayInChinese();
          result.day = dayStr === '初一' ? lunar.getMonthInChinese() + '月' : dayStr;
        } catch (e) {}
        lunarCache.set(key, result);
        return result;
      }

      function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const today = now.getDate();
        const daysInMonth = new Date(year, month, 0).getDate();
        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
        const headerCells = weekDays.map(d => `<div class="custom-cal-th">${d}</div>`).join('');
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push('<div></div>');
        for (let d = 1; d <= daysInMonth; d++) {
          const lunarInfo = safeGetLunarDay(year, month, d);
          const isToday = d === today;
          if (isToday) {
            cells.push(`<div class="custom-cal-cell"><div class="custom-cal-today"><div class="custom-cal-num-today">${d}</div><div class="custom-cal-lunar-today">${lunarInfo.day}</div></div></div>`);
          } else {
            cells.push(`<div class="custom-cal-cell"><div class="custom-cal-num">${d}</div><div class="custom-cal-lunar">${lunarInfo.day}</div></div>`);
          }
        }
        $('custom-lunar-calendar').innerHTML = `
          <div class="cal-header"><span>${year} 年 ${month} 月</span></div>
          <div class="custom-cal-grid">${headerCells}${cells.join('')}</div>
        `;
      }

      function renderHuangli() {
        const el = $('custom-huangli');
        try {
          const now = new Date();
          const solar = Solar.fromDate(now);
          const lunar = solar.getLunar();
          const yiArr = lunar.getDayYi();
          const jiArr = lunar.getDayJi();
          const yi = Array.isArray(yiArr) && yiArr.length ? yiArr.join(' ') : '无';
          const ji = Array.isArray(jiArr) && jiArr.length ? jiArr.join(' ') : '无';
          const ganzhiYear = lunar.getYearInGanZhi() ? lunar.getYearInGanZhi() + '年' : '';
          const zodiac = lunar.getYearShengXiao() ? `（${lunar.getYearShengXiao()}）` : '';
          const lunarMonth = lunar.getMonthInChinese() ? lunar.getMonthInChinese() + '月' : '';
          const lunarDay = lunar.getDayInChinese() || '';
          const holiday = getNextHoliday(now);
          const countdownStr = formatCountdown(holiday.daysLeft);
          el.innerHTML = `
            <div class="huangli-date">${ganzhiYear}${zodiac} ${lunarMonth}${lunarDay}</div>
            <div class="huangli-row"><span class="huangli-tag yi">宜</span><span class="huangli-text">${yi}</span></div>
            <div class="huangli-row ji-row"><span class="huangli-tag ji">忌</span><span class="huangli-text">${ji}</span></div>
            <div class="holiday-section">
              <div class="holiday-label">📅 距下个法定节假日 · <span class="holiday-name">${holiday.name}</span> 还剩</div>
              <div class="holiday-countdown">${countdownStr}</div>
            </div>
          `;
        } catch (err) {
          console.error('[黄历] 渲染异常:', err);
          el.innerHTML = '<div class="error-text">数据解析失败</div>';
        }
      }

      function formatCountdown(days) {
        if (days === 0) return '今天';
        const m = Math.floor(days / 30);
        const rem = days % 30;
        const w = Math.floor(rem / 7);
        const d = rem % 7;
        const parts = [];
        if (m > 0) parts.push(`${m}个月`);
        if (w > 0) parts.push(`${w}周`);
        if (d > 0) parts.push(`${d}天`);
        return parts.join(' · ');
      }

      function getNextHoliday(now) {
        const currentYear = now.getFullYear();
        const holidays = [];
        [currentYear, currentYear + 1].forEach(year => {
          try {
            holidays.push({ name: '元旦', date: `${year}-01-01` });
            holidays.push({ name: '劳动节', date: `${year}-05-01` });
            holidays.push({ name: '国庆节', date: `${year}-10-01` });
            const chunjie = Lunar.fromYmd(year, 1, 1).getSolar();
            if (chunjie) holidays.push({ name: '春节', date: chunjie.toYmd() });
            const duanwu = Lunar.fromYmd(year, 5, 5).getSolar();
            if (duanwu) holidays.push({ name: '端午节', date: duanwu.toYmd() });
            const zhongqiu = Lunar.fromYmd(year, 8, 15).getSolar();
            if (zhongqiu) holidays.push({ name: '中秋节', date: zhongqiu.toYmd() });
            const jieQiTable = Lunar.fromYmd(year, 4, 1).getJieQiTable();
            const qingming = jieQiTable && jieQiTable['清明'];
            if (qingming) {
              let ds = '';
              if (typeof qingming.getSolar === 'function') ds = qingming.getSolar().toYmd();
              else if (typeof qingming.toYmd === 'function') ds = qingming.toYmd();
              if (ds) holidays.push({ name: '清明节', date: ds });
            }
          } catch (e) {
            console.warn(`[节假日] 年份 ${year} 计算失败:`, e.message);
          }
        });
        holidays.sort((a, b) => new Date(a.date) - new Date(b.date));
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        for (const h of holidays) {
          const hd = new Date(h.date + 'T00:00:00');
          if (hd >= today) {
            const dl = Math.round((hd - today) / (1000 * 60 * 60 * 24));
            return { name: h.name, daysLeft: dl };
          }
        }
        return { name: '元旦', daysLeft: 0 };
      }

      async function renderHistory() {
        const now = new Date();
        const mm = pad(now.getMonth() + 1);
        const dd = pad(now.getDate());
        const titleEl = $('custom-history-title');
        const container = $('custom-history');
        try {
          const res = await fetch(CONFIG.historyApi + mm + '.json');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const list = data[mm + dd] || [];
          if (list.length > 0) {
            const items = [...list].sort(() => 0.5 - Math.random()).slice(0, CONFIG.maxHistoryItems);
            container.innerHTML = items.map(it =>
              `<div class="history-item"><span class="history-year">${escapeHtml(it.year)}</span><span class="history-content">${escapeHtml(it.title)}</span></div>`
            ).join('');
            titleEl.textContent = '那年今日';
            return;
          }
        } catch (e) {
          console.warn('[历史] API 请求失败:', e.message);
        }
        await renderQuote(titleEl, container);
      }

      async function renderQuote(titleEl, container) {
        try {
          const res = await fetch(CONFIG.quoteApi);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const content = data?.item?.content || '';
          const author = data?.item?.author || '';
          if (hasChinese(content) && content.length > 0) {
            container.innerHTML = `
              <div class="quote-item"><span class="quote-mark">「</span>${escapeHtml(content)}<span class="quote-mark">」</span></div>
              ${author ? `<div class="quote-author">—— ${escapeHtml(author)}</div>` : ''}
            `;
            titleEl.textContent = '今日诗词';
            return;
          }
        } catch (e) {
          console.warn('[一言] API 请求失败:', e.message);
        }
        useLocalQuote(titleEl, container);
      }

      function useLocalQuote(titleEl, container) {
        const day = new Date().getDate();
        const text = LOCAL_QUOTES[day % LOCAL_QUOTES.length];
        container.innerHTML = `<div class="quote-item"><span class="quote-mark">「</span>${text}<span class="quote-mark">」</span></div>`;
        titleEl.textContent = '每日一言';
      }

      function initCard() {
        const rightbarWidgets = document.querySelector('.widget-stack--rightbar');
        // 无右栏页面不渲染 aside，也就不会加载农历库/历史/一言接口
        if (!rightbarWidgets || !document.getElementById('rightbar-region')) return;
        // 幂等：只移除自己注入的卡片，保留主题渲染的挂件（文章页的「本文目录」#data-toc）。
        // 之前整体清空 innerHTML 会把目录一起删掉。
        rightbarWidgets.querySelectorAll('#my-custom-card').forEach((el) => el.remove());
        rightbarWidgets.insertAdjacentHTML('beforeend', `
          <div id="my-custom-card">
            <div id="custom-lunar-calendar"></div>
            <div class="card-divider"></div>
            <div id="custom-huangli" class="error-text">正在获取今日黄历...</div>
            <div class="card-divider"></div>
            <div class="history-title">
              <i class="fas fa-clock" style="color: var(--accent);"></i>
              <span id="custom-history-title">那年今日</span>
            </div>
            <div id="custom-history" style="font-size: var(--fs-13); line-height: var(--lh-copy); max-height: 200px; overflow-y: auto;">正在拉取历史事件...</div>
          </div>
        `);
        loadLunarLibrary()
          .then(() => { renderCalendar(); renderHuangli(); })
          .catch(err => {
            console.error('[初始化] 农历库加载失败:', err.message);
            $('custom-huangli').innerHTML = '<div class="error-text">农历库加载失败，请检查网络</div>';
          });
        renderHistory();
      }

      let cardInitializedOn = null;
      function initCardOnce() {
        const region = document.getElementById('rightbar-region');
        // 无右栏页面不渲染 aside，也不加载农历库/历史/一言接口
        if (!region) return;
        // SPA 换页会替换右栏节点，需要按新节点重新初始化
        if (cardInitializedOn === region) return;
        cardInitializedOn = region;
        initCard();
      }

      // 农历库/历史接口较重：右栏常驻（>1180）时才在空闲时加载，
      // 小屏抽屉默认收起，等用户真正打开右栏再加载。
      function scheduleCard() {
        if (!document.getElementById('rightbar-region')) return;
        if (!isRightbarPinned()) return;
        const run = () => {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(initCardOnce, { timeout: 4000 });
          } else {
            setTimeout(initCardOnce, 1200);
          }
        };
        if (document.readyState === 'complete') run();
        else window.addEventListener('load', run, { once: true });
      }
      scheduleCard();
    })();
    </script>