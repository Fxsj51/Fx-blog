# ==========================================
# Stellar v2 个人配置
# ==========================================

leftbar:
  brand:
    name: "Feixiao"
    tagline: "记录生活，分享技术"
    image:
      src: /images/01-avatar.webp
      variant: avatar
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: music
      title: 音乐
      icon: default:music
      url: /music/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/

profiles:
  home:
    leftbar:
      widgets: [recent]
    rightbar:
      enabled: true
      widgets: [toc]
  post:
    leftbar:
      widgets: [recent]
    rightbar:
      enabled: false
      widgets: []

# 右栏只在首页（文章列表）显示；文章详情页与其余页面（/music、/about、
# /categories/、/tags/、/archives/ 等）都不渲染右栏，也不留第三列。
# 文章页关闭后主栏沿用无右栏布局：正文吃掉右栏腾出的宽度，左缘与首页一致。
rightbar:
  enabled: false

article:
  # 文章页头部（banner 第一行右侧）显示字数与预计阅读时间
  show_reading_time: true
  # 文末相关文章数量上限；0 表示关闭。无相关文章时主题整块不渲染
  related_posts_limit: 3

# 主内容区页脚：分栏导航 + 版权说明
footer:
  sitemap:
    - title: 导航
      items:
        - '[首页](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 本站
      items:
        - '[关于](/about/)'
        - '[音乐](/music/)'
        - '[设置](/settings/)'
  # 待用户补充（补好后再追加到 content 对应位置）：
  #   - 备案号 ICP / 公安备案（如有）
  #   - 社交账号或联系方式（如有）
  content: |
    © 2026 Feixiao · 由 [Hexo](https://hexo.io/) 与 [Stellar 2.0.0](https://github.com/xaoxuu/hexo-theme-stellar) 构建。

appearance:
  preset: flat
  color_scheme: auto
  colors:
    primary: "hsl(160 60% 45%)"
  backgrounds:
    page:
      image: __SITE_ROOT__images/03-bg-1600.webp
      backdrop:
        radius: 0px
        overlay: rgba(0, 0, 0, 0.5)
        saturation: 100%

search:
  provider: local

# 第三方资源预连接（农历库、一言接口、文章封面与二维码）
preconnect:
  - https://cdn.jsdelivr.net
  - https://unpkg.com
  - https://gcore.jsdelivr.net
  - https://v1.hitokoto.cn
  - https://api.qrserver.com

features:
  # 主题自带的 partial navigation 只覆盖同一 collection（文章）之间的换页，
  # 全站无刷新改由 source/js/spa.js 接管；关闭它以避免两套拦截器重复处理点击。
  partial_navigation:
    enabled: false

inject:
  head_end: |
    <link rel="icon" href="__SITE_ROOT__favicon.ico">
    <!-- 背景恒为深色照片，站点固定深色形态：不跟随系统偏好（微信等 App 内置浏览器
         常不报 prefers-color-scheme，按浅色渲染会出现黑字压深图）。 -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1c1613">
    <!-- data-theme=dark 让主题的整套深色变量与组件覆盖无条件生效（主题原生机制）。
         必须在首帧前设置；SPA 换页不重建 <html>，属性天然保持，换页完成后兜底重申一次。
         托管标记必须带，否则 spa.js 会把它判为不兼容脚本而回退整页刷新。
         同时清掉主题自带的 theme-color meta（无条件的 #f9fafb 浅色 + 带 dark media 的 #000），
         站点为永久深色，统一收敛为唯一一条无条件的深色值，地址栏不再随系统偏好漂移。 -->
    <script data-stellar-script="site">
      document.documentElement.setAttribute('data-theme', 'dark');
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) { el.remove(); });
      var __tc = document.createElement('meta');
      __tc.setAttribute('name', 'theme-color');
      __tc.setAttribute('content', '#1c1613');
      document.head.appendChild(__tc);
      document.addEventListener('stellar:navigation-complete', function() {
        document.documentElement.setAttribute('data-theme', 'dark');
      });
    </script>
    <link rel="preload" as="image" href="__SITE_ROOT__images/03-bg-1600.webp" fetchpriority="high" media="(min-width: 901px)">
    <link rel="preload" as="image" href="__SITE_ROOT__images/03-bg-900.webp" fetchpriority="high" media="(max-width: 900px)">
    <!-- GoatCounter：关闭自带 onload 计数，首屏与 SPA 换页统一走下面这个入口，路径按站内相对路径归一 -->
    <script data-stellar-script="site">
      (function() {
        var state = window.__gcState;
        function normPath() {
          var root = '__SITE_ROOT__';
          var p = location.pathname;
          if (root && root !== '/') {
            if (p.indexOf(root) === 0) p = '/' + p.slice(root.length);
            else if (p === root.replace(/\/$/, '')) p = '/';
          }
          p = p.replace(/\/index\.html$/, '/').replace(/\/{2,}/g, '/');
          if (p.charAt(0) !== '/') p = '/' + p;
          if (p.charAt(p.length - 1) !== '/') p += '/';
          return p;
        }
        window.goatcounter = window.goatcounter || {};
        window.goatcounter.no_onload = true;
        if (!state) state = window.__gcState = { last: null, ready: false, pending: null };
        function count(p) {
          var gc = window.goatcounter;
          if (!gc || typeof gc.count !== 'function') return;
          gc.count({ path: p });
        }
        function flush() {
          var gc = window.goatcounter;
          if (!gc || typeof gc.count !== 'function' || state.ready) return;
          state.ready = true;
          state.last = state.pending || normPath();
          state.pending = null;
          count(state.last);
        }
        if (!window.__gcBound) {
          window.__gcBound = true;
          document.addEventListener('stellar:navigation-complete', function() {
            var p = normPath();
            if (!state.ready) { state.pending = p; return; }
            if (p === state.last) return;
            state.last = p;
            count(p);
          });
          // count.js 为 async：加载完成后补记首屏；被拦截或加载失败则静默跳过
          var timer = setInterval(function() {
            if (window.goatcounter && typeof window.goatcounter.count === 'function') {
              clearInterval(timer);
              flush();
            }
          }, 150);
          setTimeout(function() { clearInterval(timer); }, 10000);
        }
      })();
    </script>
    <script data-goatcounter="https://feixiao.goatcounter.com/count" async src="__SITE_ROOT__js/count.js"></script>
    <!-- 播放器只在有右栏的页面（首页/文章页）显示；音乐页用卡片，移动端 ≤1180 由 CSS 隐藏 -->
    <script src="__SITE_ROOT__js/site-player.js" data-stellar-script="site" defer></script>

    <script data-stellar-script="site">
      (function() {
        var root = document.documentElement;
        var LEFTBAR_KEY = 'stellar:v2:leftbar-state';
        // 左栏梯次唯一来源：≤667 抽屉（移动顶栏菜单开合）；668–919 收起态固定 64 窄条
        // 常驻、展开走抽屉浮层；920–1024 完整/窄条可切换；≥1025 永远完整。
        // 断点须与 CSS 的 667/668、919/920、1024/1025 及补丁里同为 667 的
        // leftbarDrawerQuery/leftbarHiddenQuery、668/919 的 leftbarRailOnlyQuery 一致。
        var LEFTBAR_DRAWER_MAX = 667;
        var LEFTBAR_RAIL_MAX = 919;
        var LEFTBAR_FULL_MIN = 1025;
        try {
          var s = localStorage.getItem(LEFTBAR_KEY);
          root.dataset.leftbarState = (s === 'collapsed') ? 'collapsed' : 'expanded';
        } catch(e) {
          root.dataset.leftbarState = 'expanded';
        }
        // ≥1025 无条件完整形态：忽略存储的 collapsed，只改首帧渲染，不写存储
        if (window.innerWidth >= LEFTBAR_FULL_MIN) root.dataset.leftbarState = 'expanded';
        // 668–919 收起态固定 64 窄条：同样只改首帧渲染、不写存储（完整内容由抽屉浮层呈现）
        if (window.innerWidth > LEFTBAR_DRAWER_MAX && window.innerWidth <= LEFTBAR_RAIL_MAX) root.dataset.leftbarState = 'collapsed';
        // 可见性与形态分开存：没有偏好时 ≥668 默认显示（内联，可收窄条），≤667 默认隐藏
        // （抽屉；LEFTBAR_DRAWER_MAX 仅作抽屉区间锚点，供 breakpoints.js 校验）
        var leftbarVisible = window.innerWidth > LEFTBAR_DRAWER_MAX ? 'shown' : 'hidden';

        root.dataset.leftbarVisible = leftbarVisible;
        function setVh() {
          var vh = window.innerHeight * 0.01;
          root.style.setProperty('--vh', vh + 'px');
          // 供无右栏页面计算左栏偏移使用：视口宽度含滚动条，减去该值即为布局宽度
          root.style.setProperty('--sbw', (window.innerWidth - document.documentElement.clientWidth) + 'px');
        }
        setVh();
        var vhTimer = null;
        window.addEventListener('resize', function() {
          clearTimeout(vhTimer);
          vhTimer = setTimeout(setVh, 60);
        });
        window.addEventListener('orientationchange', function() {
          setTimeout(setVh, 200);
        });
        // SPA 换页后页面高度变化可能带来滚动条出现/消失，需要重算 --sbw 与 --vh
        document.addEventListener('stellar:navigation-complete', setVh);
      })();
    </script>

    <link rel="stylesheet" href="__SITE_ROOT__css/site-custom.css">

  body_end: |
    <div id="music-drawer">
      <div id="music-drawer__content"></div>
    </div>

    <!-- 音乐页视图脚本：全站托管注入、仅在音乐页生效；SPA 换页后由脚本自身重新初始化 -->
    <script src="__SITE_ROOT__js/music-page.js" data-stellar-script="site" defer></script>

    <!-- 全站无刷新换页：替换页面级区域并广播 stellar:navigation-complete -->
    <script src="__SITE_ROOT__js/spa.js" data-stellar-script="site" defer></script>

    <!-- 文章页评论（giscus）：换页后按新 pathname 重建，非文章页不注入 -->
    <script src="__SITE_ROOT__js/giscus.js" data-stellar-script="site" defer></script>

    <!-- 移动端顶栏：左栏隐藏时显示头像+站名 -->
    <header id="mobile-brand-bar">
      <button type="button" id="mbb-menu-btn" class="mbb-menu-btn" aria-label="打开侧栏菜单" aria-controls="leftbar-region" aria-expanded="false">&#9776;</button>
      <a class="mbb-avatar" href="__SITE_ROOT__"><img src="__SITE_ROOT__images/01-avatar.webp" alt="头像" width="40" height="40" loading="lazy" decoding="async"></a>
      <a class="mbb-title" href="__SITE_ROOT__">
        <span class="mbb-name">__SITE_BRAND_NAME__</span>
        <span class="mbb-tagline">__SITE_BRAND_TAGLINE__</span>
      </a>
    </header>

    <!-- 注入自定义的侧边栏按钮 -->
    <button id="custom-rightbar-toggle" class="custom-toggle-btn">
      <span class="arrow-icon">‹</span>
    </button>

    <script data-stellar-script="site">
    (function() {
      'use strict';

      // 右栏断点唯一来源：>1180 常驻、≤1180 抽屉。
      // 必须与 CSS 里的 max-width: 1180px 以及 patches/hexo-theme-stellar+2.0.0.patch 保持一致。
      var RIGHTBAR_DRAWER_MAX = 1180;
      function isRightbarPinned() {
        return window.innerWidth > RIGHTBAR_DRAWER_MAX;
      }

      // 统一控制右栏显示：同时切换 class 和 inert/aria-hidden 属性
      function setRightbar(show) {
        var rightbar = document.getElementById('rightbar-region');
        // 无右栏页面（音乐/关于/分类/标签/归档等）没有可切换的面板
        if (!rightbar) return;
        if (show) {
          initCardOnce();
          document.body.classList.add('show-rightbar');
          rightbar.removeAttribute('inert');
          rightbar.setAttribute('aria-hidden', 'false');
        } else {
          document.body.classList.remove('show-rightbar');
          rightbar.setAttribute('inert', '');
          rightbar.setAttribute('aria-hidden', 'true');
        }
      }

      // 无右栏页面：隐藏右栏抽屉开关（用内联 display 覆盖 CSS，SPA 换页回到有右栏页面时能恢复）
      function syncPageChrome() {
        var toggleBtn = document.getElementById('custom-rightbar-toggle');
        var rightbar = document.getElementById('rightbar-region');
        document.body.classList.remove('show-rightbar');
        if (toggleBtn) {
          toggleBtn.style.display = rightbar ? '' : 'none';
          if (rightbar && !toggleBtn.__stellarBound) {
            toggleBtn.__stellarBound = true;
            toggleBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              setRightbar(!document.body.classList.contains('show-rightbar'));
            });
          }
        }
        // 右侧栏内部点击不冒泡，避免触发 document 关闭
        if (rightbar && !rightbar.__stellarStopClick) {
          rightbar.__stellarStopClick = true;
          rightbar.addEventListener('click', function(e) {
            e.stopPropagation();
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        var menuBtn = document.getElementById('mbb-menu-btn');

        syncPageChrome();

        // 移动端菜单按钮：≤667 复用抽屉显隐；668–919 开合 64 窄条上的抽屉浮层
        if (menuBtn) {
          var syncMenu = function() {
            var root = document.documentElement;
            var shell = document.querySelector('.site-shell');
            var shown;
            if (window.innerWidth <= 667) {
              shown = root.getAttribute('data-leftbar-visible') === 'shown';
            } else if (window.innerWidth <= 919) {
              shown = !!(shell && shell.getAttribute('data-drawer') === 'leftbar');
            } else {
              shown = true;
            }
            menuBtn.setAttribute('aria-expanded', shown ? 'true' : 'false');
          };
          menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            var shellBtn = document.querySelector('[data-shell-action="toggle-leftbar-drawer"]');
            if (shellBtn) shellBtn.click();
            syncMenu();
          });
          if ('MutationObserver' in window) {
            var menuObserver = new MutationObserver(syncMenu);
            menuObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ['data-leftbar-visible', 'data-leftbar-state']
            });
            var menuShell = document.querySelector('.site-shell');
            if (menuShell) {
              menuObserver.observe(menuShell, { attributes: true, attributeFilter: ['data-drawer'] });
            }
          }
          window.addEventListener('resize', syncMenu);
          syncMenu();
        }
      });

      // 点击页面其它地方关闭抽屉（document 级，只绑一次）
      document.addEventListener('click', function() {
        if (document.body.classList.contains('show-rightbar')) {
          setRightbar(false);
        }
      });

      // SPA 换页后：#rightbar-region 可能被替换/移除，重新同步开关并按新节点重新初始化右栏卡片
      document.addEventListener('stellar:navigation-complete', function() {
        syncPageChrome();
        scheduleCard();
      });

      // 窗口拖宽时自动收回抽屉（左栏抽屉由主题的 matchMedia 监听自动收起）
      var __sidebarResizeTimer = null;
      window.addEventListener('resize', function() {
        clearTimeout(__sidebarResizeTimer);
        __sidebarResizeTimer = setTimeout(function() {
          var body = document.body;
          var needReset = false;
          if (isRightbarPinned()) {
            initCardOnce();
            if (body.classList.contains('show-rightbar')) {
              needReset = true;
            }
          }
          if (needReset) {
            body.classList.add('sb-no-transition');
            void document.documentElement.offsetHeight;
            setRightbar(false);
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                body.classList.remove('sb-no-transition');
              });
            });
          }
        }, 100);
      });

      const CONFIG = {
        lunarCdn: [
          'https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js',
          'https://unpkg.com/lunar-javascript/lunar.js'
        ],
        hitokotoApi: 'https://v1.hitokoto.cn/?encode=json&charset=utf-8&c=d&c=i',
        quoteTimeout: 3000
      };

      const LOCAL_QUOTES = [
        "史册未载今日事，且借诗意度流年。",
        "今天在历史上或许平平无奇，但对你而言，却是独一无二的一天。",
        "历史的长河在此刻稍作停歇，留一方静谧，听风吟诗。",
        "今日无事发生，宜静心，宜读书，宜发呆。",
        "没有宏大叙事的今天，最适合记录属于你的微小日常。",
        "生活明朗，万物可爱，人间值得，未来可期。",
        "愿你踏过千重浪，能留在爱人的身旁。",
        "星光不问赶路人，时光不负有心人。",
        "保持热爱，奔赴山海。",
        "慢慢来，谁不是翻山越岭去成长。",
        "去做你想做的事，趁阳光正好，趁微风不噪。",
        "别慌，月亮也正在大海某处迷茫。",
        "把烦心事丢掉，腾出地方装鲜花。",
        "希望你的底色一直是善良和勇敢。",
        "万事都要全力以赴，包括开心。",
        "不用刻意去迎合别人，做自己就好。",
        "总有一天，你会遇到那个愿意为你弯腰的人。",
        "你只管努力，剩下的交给时间。",
        "凡是过往，皆为序章。",
        "心之所向，素履以往。"
      ];

      const lunarCache = new Map();
      const $ = (id) => document.getElementById(id);
      const hasChinese = (str) => /[\u4e00-\u9fa5]/.test(str);
      const escapeHtml = (value) => String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error('Failed to load: ' + url));
          document.head.appendChild(s);
        });
      }

      async function loadLunarLibrary() {
        if (typeof Solar !== 'undefined' && typeof Lunar !== 'undefined') return;
        for (const url of CONFIG.lunarCdn) {
          try {
            await loadScript(url);
            if (typeof Solar !== 'undefined') return;
          } catch (e) {
            console.warn('[Lunar] CDN 失败，尝试下一个:', url);
          }
        }
        throw new Error('所有农历库 CDN 均加载失败');
      }

      function safeGetLunarDay(year, month, day) {
        const key = `${year}-${month}-${day}`;
        if (lunarCache.has(key)) return lunarCache.get(key);
        let result = { day: day };
        try {
          const solar = Solar.fromYmd(year, month, day);
          const lunar = solar.getLunar();
          const dayStr = lunar.getDayInChinese();
          result.day = dayStr === '初一' ? lunar.getMonthInChinese() + '月' : dayStr;
        } catch (e) {}
        lunarCache.set(key, result);
        return result;
      }

      function renderCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const today = now.getDate();
        const daysInMonth = new Date(year, month, 0).getDate();
        const firstDay = new Date(year, month - 1, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
        const headerCells = weekDays.map(d => `<div class="custom-cal-th">${d}</div>`).join('');
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push('<div></div>');
        for (let d = 1; d <= daysInMonth; d++) {
          const lunarInfo = safeGetLunarDay(year, month, d);
          const isToday = d === today;
          if (isToday) {
            cells.push(`<div class="custom-cal-cell"><div class="custom-cal-today"><div class="custom-cal-num-today">${d}</div><div class="custom-cal-lunar-today">${lunarInfo.day}</div></div></div>`);
          } else {
            cells.push(`<div class="custom-cal-cell"><div class="custom-cal-num">${d}</div><div class="custom-cal-lunar">${lunarInfo.day}</div></div>`);
          }
        }
        // SPA 换页后右栏节点可能已被替换，异步回调写回前先确认容器仍在
        const cal = $('custom-lunar-calendar');
        if (!cal) return;
        cal.innerHTML = `
          <div class="cal-header"><span>${year} 年 ${month} 月</span></div>
          <div class="custom-cal-grid">${headerCells}${cells.join('')}</div>
        `;
      }

      function renderHuangli() {
        const el = $('custom-huangli');
        if (!el) return;
        try {
          const now = new Date();
          const solar = Solar.fromDate(now);
          const lunar = solar.getLunar();
          const yiArr = lunar.getDayYi();
          const jiArr = lunar.getDayJi();
          const yi = Array.isArray(yiArr) && yiArr.length ? yiArr.join(' ') : '无';
          const ji = Array.isArray(jiArr) && jiArr.length ? jiArr.join(' ') : '无';
          const ganzhiYear = lunar.getYearInGanZhi() ? lunar.getYearInGanZhi() + '年' : '';
          const zodiac = lunar.getYearShengXiao() ? `（${lunar.getYearShengXiao()}）` : '';
          const lunarMonth = lunar.getMonthInChinese() ? lunar.getMonthInChinese() + '月' : '';
          const lunarDay = lunar.getDayInChinese() || '';
          const holiday = getNextHoliday(now);
          const countdownStr = formatCountdown(holiday.daysLeft);
          el.innerHTML = `
            <div class="huangli-date">${ganzhiYear}${zodiac} ${lunarMonth}${lunarDay}</div>
            <div class="huangli-row"><span class="huangli-tag yi">宜</span><span class="huangli-text">${yi}</span></div>
            <div class="huangli-row ji-row"><span class="huangli-tag ji">忌</span><span class="huangli-text">${ji}</span></div>
            <div class="holiday-section">
              <div class="holiday-label">📅 距下个法定节假日 · <span class="holiday-name">${holiday.name}</span> 还剩</div>
              <div class="holiday-countdown">${countdownStr}</div>
            </div>
          `;
        } catch (err) {
          console.error('[黄历] 渲染异常:', err);
          el.innerHTML = '<div class="error-text">数据解析失败</div>';
        }
      }

      function formatCountdown(days) {
        if (days === 0) return '今天';
        const m = Math.floor(days / 30);
        const rem = days % 30;
        const w = Math.floor(rem / 7);
        const d = rem % 7;
        const parts = [];
        if (m > 0) parts.push(`${m}个月`);
        if (w > 0) parts.push(`${w}周`);
        if (d > 0) parts.push(`${d}天`);
        return parts.join(' · ');
      }

      function getNextHoliday(now) {
        const currentYear = now.getFullYear();
        const holidays = [];
        [currentYear, currentYear + 1].forEach(year => {
          try {
            holidays.push({ name: '元旦', date: `${year}-01-01` });
            holidays.push({ name: '劳动节', date: `${year}-05-01` });
            holidays.push({ name: '国庆节', date: `${year}-10-01` });
            const chunjie = Lunar.fromYmd(year, 1, 1).getSolar();
            if (chunjie) holidays.push({ name: '春节', date: chunjie.toYmd() });
            const duanwu = Lunar.fromYmd(year, 5, 5).getSolar();
            if (duanwu) holidays.push({ name: '端午节', date: duanwu.toYmd() });
            const zhongqiu = Lunar.fromYmd(year, 8, 15).getSolar();
            if (zhongqiu) holidays.push({ name: '中秋节', date: zhongqiu.toYmd() });
            const jieQiTable = Lunar.fromYmd(year, 4, 1).getJieQiTable();
            const qingming = jieQiTable && jieQiTable['清明'];
            if (qingming) {
              let ds = '';
              if (typeof qingming.getSolar === 'function') ds = qingming.getSolar().toYmd();
              else if (typeof qingming.toYmd === 'function') ds = qingming.toYmd();
              if (ds) holidays.push({ name: '清明节', date: ds });
            }
          } catch (e) {
            console.warn(`[节假日] 年份 ${year} 计算失败:`, e.message);
          }
        });
        holidays.sort((a, b) => new Date(a.date) - new Date(b.date));
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        for (const h of holidays) {
          const hd = new Date(h.date + 'T00:00:00');
          if (hd >= today) {
            const dl = Math.round((hd - today) / (1000 * 60 * 60 * 24));
            return { name: h.name, daysLeft: dl };
          }
        }
        return { name: '元旦', daysLeft: 0 };
      }

      // 取一句一言：3 秒超时，失败返回 null 由调用方走本地兜底
      async function fetchHitokoto() {
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), CONFIG.quoteTimeout) : null;
        try {
          const res = await fetch(CONFIG.hitokotoApi, controller ? { signal: controller.signal } : undefined);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const text = String(data?.hitokoto || '').trim();
          if (!hasChinese(text)) return null;
          const from = String(data?.from_who || data?.from || '').trim();
          return { text, from };
        } finally {
          if (timer) clearTimeout(timer);
        }
      }

      async function renderQuote() {
        const container = $('custom-quote');
        if (!container) return;
        let quote = null;
        try {
          quote = await fetchHitokoto();
        } catch (e) {
          console.warn('[一言] API 请求失败:', e && e.message);
        }
        // SPA 换页已替换右栏时放弃写入，避免写到被丢弃的旧节点上
        if (!container.isConnected) return;
        if (!quote) {
          const day = new Date().getDate();
          quote = { text: LOCAL_QUOTES[day % LOCAL_QUOTES.length], from: '' };
        }
        container.innerHTML = `
          <div class="quote-item">
            <div class="quote-text"><span class="quote-mark">「</span>${escapeHtml(quote.text)}<span class="quote-mark">」</span></div>
            <div class="quote-author">${quote.from ? '—— ' + escapeHtml(quote.from) : ''}</div>
          </div>
        `;
      }

      function initCard() {
        const rightbarWidgets = document.querySelector('.widget-stack--rightbar');
        // 无右栏页面不渲染 aside，也就不会加载农历库/一言接口
        if (!rightbarWidgets || !document.getElementById('rightbar-region')) return;
        // 幂等：只移除自己注入的卡片，保留主题渲染的挂件（文章页的「本文目录」#data-toc）。
        // 之前整体清空 innerHTML 会把目录一起删掉。
        rightbarWidgets.querySelectorAll('#my-custom-card').forEach((el) => el.remove());
        rightbarWidgets.insertAdjacentHTML('beforeend', `
          <div id="my-custom-card">
            <div id="custom-lunar-calendar"></div>
            <div class="card-divider"></div>
            <div id="custom-huangli" class="error-text">正在获取今日黄历...</div>
            <div class="card-divider"></div>
            <div id="custom-quote" role="note" aria-label="每日一言">正在加载一言...</div>
          </div>
        `);
        loadLunarLibrary()
          .then(() => { renderCalendar(); renderHuangli(); })
          .catch(err => {
            console.error('[初始化] 农历库加载失败:', err.message);
            const errEl = $('custom-huangli');
            if (errEl) errEl.innerHTML = '<div class="error-text">农历库加载失败，请检查网络</div>';
          });
        renderQuote();
      }

      let cardInitializedOn = null;
      function initCardOnce() {
        const region = document.getElementById('rightbar-region');
        // 无右栏页面不渲染 aside，也不加载农历库/一言接口
        if (!region) return;
        // SPA 换页会替换右栏节点，需要按新节点重新初始化
        if (cardInitializedOn === region) return;
        cardInitializedOn = region;
        initCard();
      }

      // 农历库/历史接口较重：右栏常驻（>1180）时才在空闲时加载，
      // 小屏抽屉默认收起，等用户真正打开右栏再加载。
      function scheduleCard() {
        if (!document.getElementById('rightbar-region')) return;
        if (!isRightbarPinned()) return;
        const run = () => {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(initCardOnce, { timeout: 4000 });
          } else {
            setTimeout(initCardOnce, 1200);
          }
        };
        // 不等 window.load：第三方统计等脚本挂起时 load 可能迟迟不来，卡片不应被拖住
        if (document.readyState === 'complete' || document.readyState === 'interactive') run();
        else document.addEventListener('DOMContentLoaded', run, { once: true });
      }
      scheduleCard();
    })();
    </script>
