# ==========================================
# Stellar v2 个人配置 (完美防误触版)
# ==========================================

leftbar:
  brand:
    name: "Fx的博客"
    tagline: "记录生活，分享技术"
    image:
      src: /images/01-avatar.webp
      variant: avatar
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: music
      title: 音乐
      icon: default:music
      url: /music/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/

profiles:
  home:
    leftbar:
      widgets: [recent]
    rightbar:
      enabled: true
      widgets: [toc]
  post:
    leftbar:
      widgets: [recent]
    rightbar:
      enabled: true
      widgets: [toc]

# 右栏只在首页（文章列表）与文章详情页显示；
# 其余页面（/music、/about、/categories/、/tags/、/archives/ 等）按 layout 类型默认关闭，
# 关闭后主题不会渲染 aside，也不会留出第三列。
rightbar:
  enabled: false

article:
  # 文章页头部（banner 第一行右侧）显示字数与预计阅读时间
  show_reading_time: true
  # 文末相关文章数量上限；0 表示关闭。无相关文章时主题整块不渲染
  related_posts_limit: 3

# 主内容区页脚：分栏导航 + 版权说明
footer:
  sitemap:
    - title: 导航
      items:
        - '[首页](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 本站
      items:
        - '[关于](/about/)'
        - '[音乐](/music/)'
        - '[设置](/settings/)'
  # 待用户补充（补好后再追加到 content 对应位置）：
  #   - 备案号 ICP / 公安备案（如有）
  #   - 社交账号或联系方式（如有）
  content: |
    © 2026 Fx的博客 · 由 [Hexo](https://hexo.io/) 与 [Stellar 2.0.0](https://github.com/xaoxuu/hexo-theme-stellar) 构建。

appearance:
  preset: flat
  color_scheme: auto
  colors:
    primary: "hsl(160 60% 45%)"
  backgrounds:
    page:
      image: __SITE_ROOT__images/03-bg-1600.webp
      backdrop:
        radius: 0px
        overlay: rgba(0, 0, 0, 0.5)
        saturation: 100%

search:
  provider: local

# 第三方资源预连接（农历库、历史/一言接口、文章封面与二维码）
preconnect:
  - https://cdn.jsdelivr.net
  - https://unpkg.com
  - https://gcore.jsdelivr.net
  - https://baike.baidu.com
  - https://uapis.cn
  - https://api.qrserver.com

features:
  # 主题自带的 partial navigation 只覆盖同一 collection（文章）之间的换页，
  # 全站无刷新改由 source/js/spa.js 接管；关闭它以避免两套拦截器重复处理点击。
  partial_navigation:
    enabled: false

inject:
  head_end: |
    <link rel="preload" as="image" href="__SITE_ROOT__images/03-bg-1600.webp" fetchpriority="high" media="(min-width: 901px)">
    <link rel="preload" as="image" href="__SITE_ROOT__images/03-bg-900.webp" fetchpriority="high" media="(max-width: 900px)">
    <!-- 播放器只在有右栏的页面（首页/文章页）显示；音乐页用卡片，移动端 ≤1180 由 CSS 隐藏 -->
    <script src="__SITE_ROOT__js/site-player.js" data-stellar-script="site" defer></script>

    <script data-stellar-script="site">
      (function() {
        var root = document.documentElement;
        var LEFTBAR_KEY = 'stellar:v2:leftbar-state';
        try {
          var s = localStorage.getItem(LEFTBAR_KEY);
          root.dataset.leftbarState = (s === 'collapsed') ? 'collapsed' : 'expanded';
        } catch(e) {
          root.dataset.leftbarState = 'expanded';
        }
        function setVh() {
          var vh = window.innerHeight * 0.01;
          root.style.setProperty('--vh', vh + 'px');
          // 供无右栏页面计算左栏偏移使用：视口宽度含滚动条，减去该值即为布局宽度
          root.style.setProperty('--sbw', (window.innerWidth - document.documentElement.clientWidth) + 'px');
        }
        setVh();
        var vhTimer = null;
        window.addEventListener('resize', function() {
          clearTimeout(vhTimer);
          vhTimer = setTimeout(setVh, 60);
        });
        window.addEventListener('orientationchange', function() {
          setTimeout(setVh, 200);
        });
        // SPA 换页后页面高度变化可能带来滚动条出现/消失，需要重算 --sbw 与 --vh
        document.addEventListener('stellar:navigation-complete', setVh);
      })();
    </script>

    <style>
      /*
       * 断点同源：本段媒体查询里的 1180/1181、900/901 与 body_end 注入脚本的
       * RIGHTBAR_DRAWER_MAX、patches/hexo-theme-stellar+2.0.0.patch 里的
       * rightbarDrawerQuery / leftbar*Query 必须一致。
       * 改动任意一处都会让 scripts/breakpoints.js 的构建期校验失败。
       */
      :root {
        --leftbar-w: 340px;
        --leftbar-w-collapsed: 64px;
        --rightbar-w: 380px;
        --rightbar-col-w: 380px;
        --vh: 1vh;
        --dvh: calc(var(--vh, 1vh) * 100);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        /* 动效时长档位（缓动统一用上面的 --ease） */
        --dur-fast: 0.2s;
        --dur-base: 0.3s;
        --dur-drawer: 0.38s;
        --dur-slow: 0.4s;
        --spin-dur: 20s;
      }

      /*
       * 背景层：像壁纸一样常驻
       * 1. 固定定位为独立合成层，滚动/侧栏动画时不会重绘；
       * 2. 用静态半透明遮罩替代实时 backdrop-filter，避免滚动时反复重算；
       * 3. 先用近似底色占位，图片解码前不会闪白。
       */
      body > .site-background {
        position: fixed !important;
        inset: 0 !important;
        z-index: var(--z-bg) !important;
        background-color: var(--bg-fallback) !important;
        background-attachment: fixed !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        pointer-events: none !important;
        will-change: transform;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      body > .site-background > .site-background__blur {
        background-color: var(--black-50) !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }

      /* 移动端顶栏：左栏隐藏时显示头像+站名 */
      #mobile-brand-bar {
        display: none;
        align-items: center;
        gap: var(--gap-lg);
        padding: var(--gap-md) var(--gap-xl);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: var(--z-mobile-bar);
        background: var(--mobile-bar-bg);
        -webkit-backdrop-filter: var(--blur-bar);
        backdrop-filter: var(--blur-bar);
        border-bottom: var(--border-w) solid var(--white-08);
      }
      #mobile-brand-bar .mbb-avatar img {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-circle);
        display: block;
      }
      #mobile-brand-bar .mbb-title {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: var(--text-primary);
        line-height: var(--lh-snug);
      }
      #mobile-brand-bar .mbb-name {
        font-size: var(--fs-15);
        font-weight: var(--fw-semibold);
      }
      #mobile-brand-bar .mbb-tagline {
        font-size: var(--fs-11);
        color: var(--text-muted);
        margin-top: var(--gap-2);
      }
      #mobile-brand-bar .mbb-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        padding: 0;
        border: var(--border-w) solid var(--white-15);
        border-radius: var(--radius-md);
        background: var(--white-06);
        color: var(--text-primary);
        font-size: var(--fs-18);
        line-height: var(--lh-none);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #mobile-brand-bar .mbb-menu-btn:active { background: var(--white-15); }
    
      /* 右栏在 1180px 及以下收起为抽屉，与参考站一致 */
      @media (max-width: 1180px) {
        :root { --rightbar-col-w: 0px; }
      }

      *, *::before, *::after { 
        box-sizing: border-box !important; 
        word-wrap: break-word !important;
        overflow-wrap: break-word !important;
      }
      html, body { direction: ltr !important; overflow-x: hidden !important; width: 100% !important; max-width: 100vw !important; }

      #rightside-button, .rightside-button, .rightside, .sidebar-toggle, .ui-float-button, .fab {
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        z-index: var(--z-under) !important;
      }
    </style>

    <style>
      :root {
        /* ===== 白色叠加档位（文字 / 描边 / 填充共用，后缀为不透明度百分比） ===== */
        --white-05: rgba(255, 255, 255, 0.05);
        --white-06: rgba(255, 255, 255, 0.06);
        --white-08: rgba(255, 255, 255, 0.08);
        --white-10: rgba(255, 255, 255, 0.1);
        --white-15: rgba(255, 255, 255, 0.15);
        --white-16: rgba(255, 255, 255, 0.16);
        --white-18: rgba(255, 255, 255, 0.18);
        --white-20: rgba(255, 255, 255, 0.2);
        --white-30: rgba(255, 255, 255, 0.3);
        --white-35: rgba(255, 255, 255, 0.35);
        --white-40: rgba(255, 255, 255, 0.4);
        --white-50: rgba(255, 255, 255, 0.5);
        --white-65: rgba(255, 255, 255, 0.65);
        --white-70: rgba(255, 255, 255, 0.7);
        --white-78: rgba(255, 255, 255, 0.78);
        --white-80: rgba(255, 255, 255, 0.8);
        --white-85: rgba(255, 255, 255, 0.85);
        --white-90: rgba(255, 255, 255, 0.9);
        --white-95: rgba(255, 255, 255, 0.95);
        /* ===== 黑色叠加档位（阴影 / 遮罩） ===== */
        --black-20: rgba(0, 0, 0, 0.2);
        --black-25: rgba(0, 0, 0, 0.25);
        --black-28: rgba(0, 0, 0, 0.28);
        --black-30: rgba(0, 0, 0, 0.3);
        --black-35: rgba(0, 0, 0, 0.35);
        --black-50: rgba(0, 0, 0, 0.5);
        --black-60: rgba(0, 0, 0, 0.6);
        --black-80: rgba(0, 0, 0, 0.8);

        /* ===== 文字 ===== */
        --text-primary: #ffffff;
        --text-secondary: var(--white-70);
        --text-muted: var(--white-50);
        --text-faint: var(--white-35);

        /* ===== 卡片 ===== */
        --card-bg: var(--black-25);
        --card-bg-hover: var(--black-35);
        --card-border: var(--white-20);
        --card-border-hover: var(--white-40);
        --card-shadow: inset 0 1px 1px var(--white-15), 0 4px 20px var(--black-20);
        --card-radius: var(--radius-lg);

        /* ===== 侧栏表面 / 浮层面板 / 移动顶栏 ===== */
        --surface-bg: rgba(25, 25, 25, 0.6);
        --surface-border: var(--white-10);
        --panel-bg: rgba(25, 25, 25, 0.7);
        --mini-bg: var(--black-28);
        --mobile-bar-bg: rgba(28, 28, 30, 0.72);
        --bg-fallback: #1c1613;

        /* ===== 圆角档位 ===== */
        --radius-micro: 2px;
        --radius-xs: 4px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-pill: 999px;
        --radius-circle: 50%;

        /* ===== 描边 / 阴影 ===== */
        --border-w: 1px;
        --shadow-surface: inset 0 1px 1px var(--white-15), 0 10px 30px var(--black-30);
        --shadow-inset-hi: inset 0 1px 1px var(--white-30);
        --shadow-drawer: 0 10px 40px var(--black-50);
        --shadow-collapse: -4px 0 10px var(--black-30);
        --shadow-soft: 0 4px 20px var(--black-20);
        --shadow-mini: 0 10px 30px var(--black-28);
        --shadow-glow: 0 0 10px var(--accent-glow);
        --ts-title: 0 1px 3px var(--black-80);
        --ts-soft: 0 1px 3px var(--black-60);
        --ts-caption: 0 1px 3px var(--black-50);
        --ts-subtle: 0 1px 2px var(--black-80);
        --ts-accent: 0 2px 10px var(--accent-glow);

        /* ===== 字号档位 ===== */
        --fs-8: 8px;
        --fs-10: 10px;
        --fs-11: 11px;
        --fs-12: 12px;
        --fs-13: 13px;
        --fs-14: 14px;
        --fs-15: 15px;
        --fs-16: 16px;
        --fs-18: 18px;
        --fs-22: 22px;
        --fs-24: 24px;

        /* ===== 字重 ===== */
        --fw-light: 300;
        --fw-regular: 400;
        --fw-semibold: 600;
        --fw-bold: 700;

        /* ===== 行高 / 字距 ===== */
        --lh-none: 1;
        --lh-tight: 1.1;
        --lh-snug: 1.2;
        --lh-normal: 1.3;
        --lh-title: 1.4;
        --lh-copy: 1.6;
        --ls-wide: 1px;

        /* ===== 间距档位（gap） ===== */
        --gap-xs: 6px;
        --gap-sm: 8px;
        --gap-md: 10px;
        --gap-lg: 12px;
        --gap-xl: 16px;
        --gap-2xl: 24px;
        /* 小间距补档：2px / 4px 高频且有实际含义，保留令牌；其余一次性尺寸仍写裸值 */
        --gap-2: 2px;
        --gap-4: 4px;

        /* ===== 背景模糊档位 ===== */
        --blur-bar: blur(20px) saturate(150%);
        --blur-panel: blur(20px);
        --blur-heavy: blur(30px);
        --blur-card: blur(10px);
        --blur-mini: blur(14px) saturate(140%);

        /* ===== 层级 ===== */
        --z-under: -999;
        --z-bg: -1;
        --z-rightbar: 10;
        --z-leftbar: 20;
        --z-mini: 99;
        --z-mobile-bar: 100;
        --z-drawer: 9990;
        --z-drawer-toggle: 9995;
        --z-drawer-btn: 9999;
        --z-max: 2147483647;

        /* ===== 强调色 ===== */
        --accent: #1DB954;
        --accent-glow: rgba(29, 185, 84, 0.4);
        --danger: #e74c3c;
      }

      .site-workspace {
        display: grid !important;
        grid-template-columns: var(--leftbar-w) minmax(0, 1000px) var(--rightbar-col-w) !important;
        justify-content: center !important;
        gap: 0 !important;
        transition: grid-template-columns var(--dur-slow) var(--ease) !important;
        overflow-x: hidden !important;
      }
      html[data-leftbar-state="collapsed"] .site-workspace {
        grid-template-columns: var(--leftbar-w-collapsed) minmax(0, 1000px) var(--rightbar-col-w) !important;
      }
      /* 无右栏页面（data-regions 由服务端按 layout 计算）：主栏只占两列，不留 380px 空档 */
      .site-shell:not([data-regions~='rightbar']) .site-workspace {
        grid-template-columns: var(--leftbar-w) minmax(0, 1000px) !important;
      }
      html[data-leftbar-state="collapsed"] .site-shell:not([data-regions~='rightbar']) .site-workspace {
        grid-template-columns: var(--leftbar-w-collapsed) minmax(0, 1000px) !important;
      }
      /*
       * 无右栏页面（≥1181px，右栏为常驻列的区间）：
       * 1. 两列布局会让整块重新居中，左栏因此随页面切换横向位移。把左栏改为固定定位，直接钉在与首页/文章页
       *    相同的横向位置，不再受网格列数变化（含换页时的列过渡）影响。
       * 2. 第一列宽度 = 左栏宽度 + 左栏在首页的左边距，正文因此紧贴左栏、左缘与首页正文一致；
       *    justify-content: start 让剩余空间全部落在页面右侧，不再把两列整体居中（消除左栏与正文间的空白）。
       * 3. 折叠时左栏在首页会右移 138px（右栏列宽 380px 的一半），这里用 transform 复现同样的滑动，
       *    第一列同步加上同样的位移，保证正文左缘仍与首页折叠态一致（1366 等窄屏位移为 0）。
       */
      @media screen and (min-width: 1181px) {
        .site-shell:not([data-regions~='rightbar']) .site-workspace {
          --nd-off: max(0px, (100vw - var(--sbw, 8px) - 1720px) / 2);
          grid-template-columns: calc(var(--leftbar-w) + var(--nd-off)) minmax(0, 1000px) !important;
          justify-content: start !important;
        }
        html[data-leftbar-state="collapsed"] .site-shell:not([data-regions~='rightbar']) .site-workspace {
          grid-template-columns: calc(var(--leftbar-w-collapsed) + var(--nd-off) + min(138px, max(0px, (100vw - var(--sbw, 8px) - 1444px) / 2))) minmax(0, 1000px) !important;
        }
        .site-shell:not([data-regions~='rightbar']) aside#leftbar-region {
          position: fixed !important;
          top: 0 !important;
          inset-inline-start: max(0px, (100vw - var(--sbw, 8px) - 1720px) / 2) !important;
          transition: width var(--dur-slow) var(--ease), min-width var(--dur-slow) var(--ease), max-width var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease) !important;
        }
        html[data-leftbar-state="collapsed"] .site-shell:not([data-regions~='rightbar']) aside#leftbar-region {
          transform: translateX(min(138px, max(0px, (100vw - var(--sbw, 8px) - 1444px) / 2))) !important;
        }
      }

      aside#leftbar-region {
        grid-column: 1 !important;
        width: 340px !important;
        min-width: 340px !important;
        max-width: 340px !important;
        height: var(--dvh) !important;
        position: sticky !important;
        top: 0 !important;
        z-index: var(--z-leftbar) !important;
        background: transparent !important;
        transition: width var(--dur-slow) var(--ease), min-width var(--dur-slow) var(--ease), max-width var(--dur-slow) var(--ease) !important;
      }
      html[data-leftbar-state="collapsed"] .site-shell:not([data-drawer='leftbar']) aside#leftbar-region {
        width: 64px !important;
        min-width: 64px !important;
        max-width: 64px !important;
      }

      #leftbar-region .site-region__surface {
        position: absolute !important;
        top: 20px !important;
        bottom: 20px !important;
        left: 40px !important;
        right: 0 !important;
        width: auto !important;
        height: auto !important;
        min-width: 0 !important;
        margin: 0 !important;
        background-color: var(--surface-bg) !important;
        backdrop-filter: var(--blur-panel) !important;
        -webkit-backdrop-filter: var(--blur-panel) !important;
        border: var(--border-w) solid var(--surface-border) !important;
        border-radius: var(--radius-xl) !important;
        box-shadow: var(--shadow-surface) !important;
        padding: 30px var(--gap-2xl) !important;
        display: flex !important;
        flex-direction: column !important;
        transition: left var(--dur-slow) var(--ease), padding var(--dur-slow) var(--ease) !important;
        overflow: hidden !important;
      }

      html[data-leftbar-state="collapsed"] .site-shell:not([data-drawer='leftbar']) #leftbar-region .site-region__surface {
        left: 8px !important;
        padding: 20px var(--gap-xs) !important;
        align-items: center !important;
      }

      aside#rightbar-region {
        grid-column: 3 !important;
        width: 380px !important;
        min-width: 380px !important;
        max-width: 380px !important;
        height: var(--dvh) !important;
        position: sticky !important;
        top: 0 !important;
        display: block !important;
        background: transparent !important;
        transition: transform var(--dur-slow) var(--ease), opacity var(--dur-slow) var(--ease) !important;
        transform: translateX(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        z-index: var(--z-rightbar) !important;
      }

      body.sb-no-transition aside#rightbar-region,
      body.sb-no-transition aside#leftbar-region {
        transition: none !important;
      }

      main.site-main {
        grid-column: 2 !important;
        width: 100% !important;
        max-width: 100% !important; 
        margin: 0 !important;
        padding: 20px 40px 160px 40px !important; 
        box-sizing: border-box !important; 
        overflow: hidden !important;
        transition: none !important;
        min-width: 0 !important;
        min-height: 100vh !important; 
        display: block !important;    
      }

      main.site-main > *,
      main.site-main .post-list,
      main.site-main .post-card-wrap,
      main.site-main .post-card,
      main.site-main .listing-nav {
        width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        box-sizing: border-box !important;
      }

